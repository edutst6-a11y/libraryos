<text x="450.0" y="136" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Self-Service Kiosks</text>
<text x="450.0" y="156" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">member check-out/return</text>
<rect x="600" y="114" width="260" height="104" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
