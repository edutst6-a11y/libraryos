<text x="730.0" y="156" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">web/mobile catalogue search</text>
<rect x="900" y="114" width="320" height="104" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="1060.0" y="136" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Operational SQL Database</text>
<text x="1060.0" y="156" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">PostgreSQL — today's system of record</text>
<rect x="1250" y="114" width="200" height="104" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="1350.0" y="136" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Legacy branch exports</text>
<text x="1350.0" y="156" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">CSV/partner feeds</text>
<rect x="60" y="294" width="340" height="104" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="230.0" y="316" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Kafka</text>
<text x="230.0" y="336" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">real-time event stream: loan, return,</text>
<text x="230.0" y="351" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">reservation, fine events</text>
<rect x="460" y="294" width="340" height="104" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="630.0" y="316" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Batch Extraction (Sqoop-style)</text>
<text x="630.0" y="336" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">nightly full/incremental pull from</text>
<text x="630.0" y="351" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">the operational SQL database</text>
<rect x="900" y="294" width="300" height="104" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="1050.0" y="316" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">External Feeds</text>
<text x="1050.0" y="336" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">e-book platform usage,</text>
<text x="1050.0" y="351" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">inter-library loan network</text>
<rect x="60" y="474" width="420" height="114" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="270.0" y="496" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Data Lake (HDFS)</text>
<text x="270.0" y="516" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">raw zone — every event and export kept</text>
<text x="270.0" y="531" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">as-is, cheap distributed storage,</text>
<text x="270.0" y="546" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">scales to billions of records</text>
<rect x="560" y="474" width="420" height="114" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="770.0" y="496" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Data Warehouse (Hive)</text>
<text x="770.0" y="516" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">curated zone — cleaned, structured</text>
<text x="770.0" y="531" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">into fact/dimension tables for</text>
<text x="770.0" y="546" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">fast SQL-style analytics</text>
<rect x="1060" y="474" width="340" height="114" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="1230.0" y="496" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Metadata / Governance</text>
<text x="1230.0" y="516" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">schema registry,</text>
<text x="1230.0" y="531" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">data catalogue</text>
<rect x="60" y="664" width="420" height="84" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="270.0" y="686" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Spark (batch)</text>
<text x="270.0" y="706" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">large-scale ETL: clean, join,</text>
<text x="270.0" y="721" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">aggregate raw data into the warehouse</text>
<rect x="560" y="664" width="420" height="84" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="770.0" y="686" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Spark Streaming</text>
<text x="770.0" y="706" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">real-time processing of the Kafka feed</text>
<text x="770.0" y="721" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">(e.g. live “currently checked out” counts)</text>
<rect x="1060" y="664" width="340" height="84" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="1230.0" y="686" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">ML / Recommendation Jobs</text>
<text x="1230.0" y="706" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">usage-pattern modelling,</text>
<text x="1230.0" y="721" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">demand forecasting</text>
<rect x="60" y="824" width="330" height="104" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="225.0" y="846" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">BI Dashboards</text>
<text x="225.0" y="866" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">Power BI / Tableau —</text>
<text x="225.0" y="881" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">usage trends, branch performance</text>
<rect x="460" y="824" width="330" height="104" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="625.0" y="846" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Ad-hoc Analyst Queries</text>
<text x="625.0" y="866" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">HiveQL / SparkSQL over</text>
<text x="625.0" y="881" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">the warehouse</text>
<rect x="860" y="824" width="340" height="104" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="1030.0" y="846" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Library Management Decisions</text>
<text x="1030.0" y="866" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">stock purchasing, staffing,</text>
<text x="1030.0" y="881" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">branch investment, fine policy</text>
<rect x="1260" y="824" width="200" height="104" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
<text x="1360.0" y="846" font-family="Verdana, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#14314f" text-anchor="middle">Member-Facing Features</text>
<text x="1360.0" y="866" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">“recommended for you”,</text>
<text x="1360.0" y="881" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#444444" text-anchor="middle">real-time availability</text>
